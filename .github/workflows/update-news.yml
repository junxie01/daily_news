name: Update Hot News and Deploy

on:
  schedule:
    - cron: '0 23 * * *'  # 北京时间7点
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install and connect Cloudflare WARP
      run: |
        # Install proxychains-ng
        sudo apt-get install -y proxychains-ng
        # Add Cloudflare GPG key and repository
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        # Install WARP
        sudo apt-get update && sudo apt-get install -y cloudflare-warp
        # Start WARP service
        sudo systemctl start warp-svc
        # Wait for service to start
        sleep 3
        # Register with TOS acceptance
        sudo warp-cli --accept-tos registration new
        # Connect to WARP
        sudo warp-cli --accept-tos connect
        # Wait for connection
        sleep 10
        # Verify connection
        curl -s https://www.cloudflare.com/cdn-cgi/trace/
        # Test accessing international site
        echo "Testing CNN access..."
        curl -s -o /dev/null -w "%{http_code}" https://www.cnn.com || echo "CNN access failed"

    - name: Fetch and process news
      run: |
        python scripts/fetch_news.py

    - name: Commit and push changes
      uses: EndBug/add-and-commit@v9
      with:
        message: "Update hot news $(date '+%Y-%m-%d')"
        add: data
        push: true

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
